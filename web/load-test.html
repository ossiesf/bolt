<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolt - Load Testing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1a1a2e;
            color: #eee;
        }
        
        h1 {
            color: #c8b6ff;
            text-align: center;
        }
        
        h2 {
            color: #c8b6ff;
            margin-top: 30px;
            border-bottom: 2px solid #c8b6ff;
            padding-bottom: 10px;
        }
        
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        
        .controls label {
            margin: 0 15px;
            color: #eee;
        }
        
        .controls input {
            padding: 8px;
            margin-left: 10px;
            background-color: #16213e;
            color: #eee;
            border: 1px solid #c8b6ff;
            border-radius: 4px;
            width: 80px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #c8b6ff;
            color: #1a1a2e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background-color: #b39ddb;
        }
        
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        
        #results {
            margin-top: 30px;
            padding: 20px;
            background-color: #16213e;
            border-radius: 8px;
        }
        
        .metric {
            margin: 10px 0;
            padding: 15px;
            background-color: #0f3460;
            border-left: 3px solid #c8b6ff;
            border-radius: 4px;
        }
        
        .grafana-images {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }

        .grafana-images img {
            width: 45%;
            height: auto;
            padding: 10px;
            background-color: black;
            border-radius: 8px;
        }
        
        .debug-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #0f3460;
        }
        
        .debug-section summary {
            cursor: pointer;
            padding: 10px;
            background-color: #0f3460;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .debug-section summary:hover {
            background-color: #16213e;
        }
        
        pre {
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            background-color: #0a0e27;
            padding: 15px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.4;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(200, 182, 255, 0.3);
            border-top-color: #c8b6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-container {
            text-align: center;
            padding: 40px;
        }

        .loading-container .big-spinner {
            width: 60px;
            height: 60px;
            border-width: 6px;
            margin: 20px auto;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

    @keyframes dots {
        0%, 20% {
            content: '';
        }
        40% {
            content: '.';
        }
        60% {
            content: '..';
        }
        80%, 100% {
            content: '...';
        }
    }

    </style>
</head>
<body>
    <h1>Load Testing Dashboard</h1>
    
    <div class="controls">
        <label>
            Users: <input type="number" id="users" value="50" min="1" max="100">
        </label>
        <label>
            Duration (seconds): <input type="number" id="duration" value="60" min="5" max="300">
        </label>
        <br><br>
        <button id="runTest">Run Load Test</button>
    </div>
    
    <div id="results">
        <p>Configure your test and click "Run Load Test" to begin...</p>
    </div>
    
    <script>
        const runButton = document.getElementById('runTest');
        const resultsDiv = document.getElementById('results');

        runButton.addEventListener('click', async () => {
        const users = document.getElementById('users').value;
        const duration = document.getElementById('duration').value;
        
        runButton.disabled = true;
        runButton.innerHTML = 'Running<span class="loading-dots"></span>';
        resultsDiv.innerHTML = `
            <div class="loading-container">
                <div class="big-spinner spinner"></div>
                <p>Running load test with ${users} users for ${duration} seconds...</p>
                <p style="color: #999; font-size: 14px;">This may take a while, please wait...</p>
            </div>
        `;
            
        try {
            const response = await fetch('/api/run-load-test', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    users: parseInt(users),
                    duration: parseInt(duration)
                })
            });
            
            const data = await response.json();
            
            // Handle busy status
            if (data.status === 'busy') {
                resultsDiv.innerHTML = `
                    <div class="metric" style="border-left-color: #ff9800;">
                        <strong>⚠️ ${data.message}</strong>
                    </div>
                `;
                return;
            }
            
            // Handle error status
            if (data.status === 'error') {
                resultsDiv.innerHTML = `
                    <div class="metric" style="border-left-color: #ff6b6b;">
                        <strong>❌ Error:</strong> ${data.message}
                    </div>
                `;
                return;
            }
            
            // Success - display results
            if (data.status === 'completed') {
                displayResults(data);
            }
            
        } catch (error) {
            console.error('Full error:', error);
            resultsDiv.innerHTML = `<p style="color: #ff6b6b;">Error: ${error.message}</p>`;
        } finally {
            runButton.disabled = false;
            runButton.textContent = 'Run Load Test';
        }
    });

        function cleanLocustOutput(output) {
            if (!output) return 'None';
            
            // Remove ANSI escape codes
            let cleaned = output.replace(/\x1b\[[0-9;]*m/g, '');
            
            // Remove progress bar lines and repeated status updates
            cleaned = cleaned.split('\n')
                .filter(line => {
                    // Keep important lines, filter out progress bars and repetitive status
                    return !line.includes('█') && 
                           !line.includes('iteration') &&
                           !line.match(/^\s*\d+\s+\d+\.\d+\s+\d+\.\d+\s*$/);
                })
                .join('\n');
            
            // Remove excessive blank lines
            cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
            
            return cleaned.trim() || 'No output';
        }

        function displayResults(data) {
            let html = '<h2>Test Results</h2>';
            
            // Metrics first
            html += `
                <div class="metric">
                    <strong>Total Requests:</strong> ${(data.total_requests || 0).toLocaleString()}
                </div>
                <div class="metric">
                    <strong>Requests/sec:</strong> ${(data.requests_per_sec || 0).toFixed(2)}
                </div>
                <div class="metric">
                    <strong>Average Response Time:</strong> ${(data.avg_response_time || 0).toFixed(0)} ms
                </div>
                <div class="metric" style="${data.failures > 0 ? 'border-left-color: #ff6b6b;' : 'border-left-color: #4CAF50;'}">
                    <strong>Failures:</strong> ${data.failures || 0}
                </div>
            `;
            
            // Grafana images section
            if (data.grafana_panel_6 || data.grafana_panel_8 || data.grafana_panel_12) {
                html += '<h2>Grafana Metrics (Live)</h2>';
                html += '<div class="grafana-images">';  // Keep same class name
                
                if (data.grafana_panel_6) {
                    html += `<iframe src="${data.grafana_panel_6}" width="100%" height="300" frameborder="0"></iframe>`;
                }
                if (data.grafana_panel_8) {
                    html += `<iframe src="${data.grafana_panel_8}" width="100%" height="300" frameborder="0"></iframe>`;
                }
                if (data.grafana_panel_12) {
                    html += `<iframe src="${data.grafana_panel_12}" width="100%" height="300" frameborder="0"></iframe>`;
                }
                
                html += '</div>';
            }
                    
            // Debug section - collapsible
            html += '<div class="debug-section">';
            html += '<details>';
            html += '<summary>Debug Information (click to expand)</summary>';
            
            if (data.csv_error) {
                html += `<div class="metric" style="border-left-color: #ff6b6b;">
                    <strong>CSV Error:</strong> ${data.csv_error}
                </div>`;
            }
            
            html += `<div class="metric">
                <strong>Return Code:</strong> ${data.return_code !== undefined ? data.return_code : 'N/A'}
            </div>`;
            
            const cleanedStdout = cleanLocustOutput(data.locust_stdout);
            const cleanedStderr = cleanLocustOutput(data.locust_stderr);
            
            html += `<div class="metric">
                <strong>Locust Output:</strong><br>
                <pre>${cleanedStdout}</pre>
            </div>`;
            
            if (cleanedStderr !== 'None' && cleanedStderr !== 'No output') {
                html += `<div class="metric" style="border-left-color: #ff9800;">
                    <strong>Locust Warnings/Errors:</strong><br>
                    <pre>${cleanedStderr}</pre>
                </div>`;
            }
            
            html += '</details>';
            html += '</div>';
            
            resultsDiv.innerHTML = html;
        }
    </script>

</body>
